worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    # Basic abuse protection for the API surface
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

    # Docker embedded DNS: re-resolve container names so backend/frontend
    # recreations never leave nginx pointing at a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # --- Security headers ---
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        # --- WebSocket (game realtime) ---
        location /api/ws {
            set $b http://backend:8000; proxy_pass $b;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;   # long-lived game connections
            proxy_send_timeout 3600s;
        }

        # --- Auth endpoints: stricter rate limit + no caching ---
        location ~ ^/api/auth {
            limit_req zone=api_auth burst=20 nodelay;
            set $b http://backend:8000;
            proxy_pass $b;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control "no-store" always;
        }

        # --- REST API ---
        location /api/ {
            limit_req zone=api_general burst=60 nodelay;
            set $b http://backend:8000; proxy_pass $b;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Next.js app ---
        location / {
            set $f http://frontend:3000; proxy_pass $f;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;   # HMR in dev-like setups
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


